name = "templates_tools"
description = "Test and release tooling for the templates crate"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@example.com>"]
maintainers-logins = ["bbracke"]

licenses = "MIT OR Apache-2.0"
website = ""
tags = ["templates", "tooling", "release", "tests"]

project-files = ["templates_tools.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
project_tools = "*"

[[depends-on]]
templates = "*"

[[pins]]
project_tools = { path = "../../project_tools" }

[[pins]]
templates = { path = ".." }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so roots that share these crates share object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
