name = "templates_tests"
description = "AUnit tests for the templates crate"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@example.com>"]
maintainers-logins = ["bbracke"]

licenses = "MIT OR Apache-2.0"
website = ""
tags = ["templates", "tests"]

executables = ["tests"]

project-files = ["templates_tests.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
aunit = "*"

[[depends-on]]
templates = "*"

[[pins]]
templates = { path = ".." }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so roots that share these crates share object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
