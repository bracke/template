name = "templates"
description = "Small Handlebars-like block template engine in Ada"
version = "1.0.0"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@example.com>"]
maintainers-logins = ["bbracke"]

licenses = "MIT OR Apache-2.0"
website = "https://github.com/bracke/template.git"
long-description = "templates is a small Ada 2022, dependency-light, server-side HTML template engine. It supports a deliberately small Handlebars-like block syntax for variables, conditionals, and loops."
tags = ["templates", "html", "server", "handlebars"]

project-files = ["templates.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so roots that share these crates share object files rather
# than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
